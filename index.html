<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Recepta AI is an AI front desk for local service businesses — it answers website chat and texts back every missed call 24/7, qualifies the lead, and books it straight into your calendar."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Recepta AI — Your AI Front Desk, 24/7" />
    <meta
      property="og:description"
      content="Never miss another customer. Recepta AI answers every chat and texts back every missed call in seconds, then books the appointment for you."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Recepta AI — Your AI Front Desk, 24/7" />
    <meta
      name="twitter:description"
      content="Never miss another customer. Recepta AI answers every chat and texts back every missed call in seconds, then books the appointment for you."
    />
    <title>Recepta AI — Your AI Front Desk, 24/7</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Static form so Netlify's build-time bot can discover and register
      "founding-partner-waitlist" as a Netlify Form. Never rendered — the
      visible form lives in src/components/WaitlistForm.tsx and posts to
      this form name. See README for Netlify Forms setup.
    -->
    <form name="founding-partner-waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="industry" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
